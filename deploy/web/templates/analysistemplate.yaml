{{- if .Values.canary.analysis }}
# Canary gate: query Prometheus for the app's HTTP success rate. If it drops
# below the threshold during the canary step, Argo Rollouts aborts and rolls back.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
  labels:
    {{- include "web.labels" . | nindent 4 }}
spec:
  metrics:
    - name: success-rate
      interval: 15s
      count: 4
      successCondition: result[0] >= {{ .Values.prometheus.successRate }}
      failureLimit: 1
      provider:
        prometheus:
          address: {{ .Values.prometheus.address }}
          query: >-
            sum(rate(http_requests_total{app="web",status!~"5.."}[1m]))
            /
            sum(rate(http_requests_total{app="web"}[1m]))
{{- end }}
