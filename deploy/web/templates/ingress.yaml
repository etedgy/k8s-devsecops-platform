apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  labels:
    {{- include "web.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-stable
                port:
                  number: {{ .Values.service.port }}
