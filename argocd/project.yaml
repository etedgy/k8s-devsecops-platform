apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: rafael
  namespace: argocd
spec:
  description: Rafael DevSecOps assignment app
  sourceRepos:
    - https://github.com/etedgy/k8s-devsecops-platform.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "web-*"
    - server: https://kubernetes.default.svc
      namespace: argocd
  clusterResourceWhitelist:
    - { group: "*", kind: "*" }
  namespaceResourceWhitelist:
    - { group: "*", kind: "*" }
